name: keep-warm

on:
  schedule:
    - cron: '0 1 * * 1,4'
  workflow_dispatch:

env:
  URL: ${{ secrets.SUPABASE_URL }}
  KEY: ${{ secrets.SUPABASE_KEY }}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: >
          curl -sSf -X POST "${URL}/rest/v1/keepalive"
          -H "apikey: ${KEY}"
          -H "Authorization: Bearer ${KEY}"
          -H "Content-Type: application/json"
          -H "Prefer: return=minimal"
          -d '{}' && echo "[$(date -u '+%Y-%m-%d %H:%M:%S')] done"